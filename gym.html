<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Tracker</title>
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --input: #f4f4f5;
    --accent: #18181b;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --card: #1c1d21;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #2e2f35;
      --input: #26272c;
      --accent: #f4f4f5;
      --accent-text: #111214;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 24px; margin: 4px 0 16px; }

  form.add { display: flex; gap: 8px; margin-bottom: 20px; }
  input {
    font: inherit;
    font-size: 16px; /* stops iOS zooming on focus */
    color: var(--text);
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    width: 100%;
    min-width: 0;
  }
  input:focus { outline: 2px solid var(--muted); outline-offset: -1px; }
  form.add input { background: var(--card); }
  button {
    font: inherit;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  form.add button {
    background: var(--accent);
    color: var(--accent-text);
    padding: 0 18px;
    font-weight: 600;
    white-space: nowrap;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .name { font-weight: 650; font-size: 17px; flex: 1; overflow-wrap: anywhere; }
  .del {
    background: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    padding: 4px 6px;
  }
  .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .fields input { text-align: center; font-variant-numeric: tabular-nums; }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; }
  .when { font-size: 12px; color: var(--muted); }
  .rating { display: flex; gap: 6px; }
  .rating button {
    background: var(--input);
    border: 2px solid transparent;
    font-size: 22px;
    width: 46px;
    height: 42px;
    opacity: 0.35;
    transition: opacity .15s;
  }
  .rating button.on { opacity: 1; border-color: var(--muted); }

  .save {
    display: none;
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }
  .card.dirty .save { display: block; }
  .save:disabled { opacity: 0.5; }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .status { color: #dc2626; font-size: 14px; margin: -8px 0 16px; }
  .status:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1>Gym Tracker</h1>

  <form class="add" id="add">
    <input id="newName" placeholder="Add exercise…" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>

  <div class="status" id="status"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://oaltkxblacpjjecpauya.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hbHRreGJsYWNwamplY3BhdXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4OTc2ODQsImV4cCI6MjA4NDQ3MzY4NH0.zDfKgAKfWjXMQsOP5ZpD_nl6yhZS1O4H794HqSRDLVo";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const RATINGS = { green: '🟢', amber: '🟡', red: '🔴' };

  // [{ id, name, latest: { weight, reps, sets, rating, created_at } | null }]
  let exercises = [];

  function showError(msg) { document.getElementById('status').textContent = msg || ''; }

  async function load() {
    const [ex, latest] = await Promise.all([
      db.from('gym_exercises').select('id, name').order('created_at'),
      db.from('gym_latest').select('exercise_id, weight, reps, sets, rating, created_at'),
    ]);
    if (ex.error || latest.error) {
      showError('Could not load from Supabase: ' + (ex.error || latest.error).message);
      document.getElementById('list').innerHTML = '';
      return;
    }
    const byId = Object.fromEntries(latest.data.map(l => [l.exercise_id, l]));
    exercises = ex.data.map(e => ({ ...e, latest: byId[e.id] || null }));
    render();
  }

  function formatDate(iso) {
    if (!iso) return 'Not done yet';
    const d = new Date(iso);
    const start = t => new Date(t).setHours(0, 0, 0, 0);
    const days = Math.round((start(Date.now()) - start(d)) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + ' days ago';
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }

  const num = v => (v === '' || v == null || isNaN(v)) ? null : Number(v);

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!exercises.length) {
      list.innerHTML = '<div class="empty">No exercises yet — add one above.</div>';
      return;
    }
    exercises.forEach(ex => {
      const last = ex.latest || {};
      let rating = last.rating || null;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="head">
          <div class="name"></div>
          <button class="del" title="Delete">×</button>
        </div>
        <div class="fields">
          <div><label>Weight (kg)</label><input data-f="weight" inputmode="decimal"></div>
          <div><label>Reps</label><input data-f="reps" inputmode="numeric"></div>
          <div><label>Sets</label><input data-f="sets" inputmode="numeric"></div>
        </div>
        <div class="foot">
          <span class="when"></span>
          <div class="rating">
            ${Object.entries(RATINGS).map(([k, r]) => `<button data-r="${k}" class="${rating === k ? 'on' : ''}">${r}</button>`).join('')}
          </div>
        </div>
        <button class="save">Save</button>`;

      card.querySelector('.name').textContent = ex.name;
      card.querySelector('.when').textContent = formatDate(last.created_at);

      const inputs = card.querySelectorAll('input[data-f]');
      inputs.forEach(input => {
        input.value = last[input.dataset.f] ?? '';
        input.addEventListener('input', () => card.classList.add('dirty'));
      });

      card.querySelectorAll('.rating button').forEach(btn => {
        btn.addEventListener('click', () => {
          rating = rating === btn.dataset.r ? null : btn.dataset.r;
          card.querySelectorAll('.rating button').forEach(b => b.classList.toggle('on', b.dataset.r === rating));
          card.classList.add('dirty');
        });
      });

      const saveBtn = card.querySelector('.save');
      saveBtn.addEventListener('click', async () => {
        const entry = { exercise_id: ex.id, rating };
        inputs.forEach(i => entry[i.dataset.f] = num(i.value.trim()));
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        const { data, error } = await db.from('gym_entries').insert(entry).select().single();
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        if (error) return showError('Save failed: ' + error.message);
        showError();
        ex.latest = data;
        card.classList.remove('dirty');
        card.querySelector('.when').textContent = formatDate(data.created_at);
      });

      card.querySelector('.del').addEventListener('click', async () => {
        if (!confirm(`Delete "${ex.name}" and all its history?`)) return;
        const { error } = await db.from('gym_exercises').delete().eq('id', ex.id);
        if (error) return showError('Delete failed: ' + error.message);
        exercises = exercises.filter(e => e !== ex);
        render();
      });

      list.appendChild(card);
    });
  }

  document.getElementById('add').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('newName');
    const name = input.value.trim();
    if (!name) return;
    const { data, error } = await db.from('gym_exercises').insert({ name }).select('id, name').single();
    if (error) return showError('Add failed: ' + error.message);
    showError();
    exercises.push({ ...data, latest: null });
    input.value = '';
    render();
  });

  load();
</script>
</body>
</html>
