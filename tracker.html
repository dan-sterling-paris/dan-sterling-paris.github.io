<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Three Goals Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">

  <div class="max-w-md mx-auto px-4 pt-6 pb-12 space-y-5">

    <!-- Minimal Header -->
    <header class="flex items-center justify-between px-1">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900">Weekly Habits</h1>
        <p id="today-headline" class="text-xs font-semibold text-slate-400 mt-0.5"></p>
      </div>
      <button 
        onclick="resetDemoData()" 
        class="text-xs font-bold text-slate-400 hover:text-slate-600 bg-white px-3 py-1.5 rounded-full border border-slate-200 active:scale-95 shadow-xs">
        Reset
      </button>
    </header>

    <!-- Habit 1: CALORIES -->
    <div id="card-cals" class="bg-white rounded-3xl p-4 shadow-xs border border-slate-200/80 space-y-3">
      <div class="flex items-center justify-between px-1">
        <div>
          <h2 class="text-sm font-black text-slate-900">1. Calories</h2>
          <p class="text-[11px] font-semibold text-slate-400">5d 1700 &bull; 2d Maint</p>
        </div>
        <div id="cals-badges" class="flex items-center gap-1.5 text-[11px] font-black">
          <!-- Badges -->
        </div>
      </div>

      <!-- Clean 7-day row -->
      <div class="grid grid-cols-7 gap-1.5" id="cals-7d-row">
        <!-- 7 day tiles -->
      </div>
    </div>

    <!-- Habit 2: ALCOHOL ALLOWANCE -->
    <div id="card-alcohol" class="bg-white rounded-3xl p-4 shadow-xs border border-slate-200/80 space-y-3">
      <div class="flex items-center justify-between px-1">
        <div>
          <h2 class="text-sm font-black text-slate-900">2. Alcohol Units</h2>
          <p class="text-[11px] font-semibold text-slate-400">Max 14u / rolling 7 days</p>
        </div>
        <div id="alcohol-pill" class="flex items-center gap-1 text-[11px] font-black">
          <!-- Alcohol badge -->
        </div>
      </div>

      <!-- Clean 7-day row -->
      <div class="grid grid-cols-7 gap-1.5" id="alcohol-7d-row">
        <!-- 7 day tiles -->
      </div>
    </div>

    <!-- Habit 3: DAILY ACTIVITY -->
    <div id="card-activity" class="bg-white rounded-3xl p-4 shadow-xs border border-slate-200/80 space-y-3">
      <div class="flex items-center justify-between px-1">
        <div>
          <h2 class="text-sm font-black text-slate-900">3. Daily Activity</h2>
          <p class="text-[11px] font-semibold text-slate-400">8k Steps &bull; Gym &bull; Swim</p>
        </div>
        <div id="activity-streak-pill" class="flex items-center gap-1 text-[11px] font-black">
          <!-- Activity badge -->
        </div>
      </div>

      <!-- Clean 7-day row -->
      <div class="grid grid-cols-7 gap-1.5" id="activity-7d-row">
        <!-- 7 day tiles -->
      </div>
    </div>

    <!-- 28-Day Overview Toggle (Subtle & at the bottom) -->
    <div class="pt-2 text-center">
      <button 
        onclick="toggle28DayView()" 
        class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-slate-700 bg-white px-4 py-2 rounded-2xl border border-slate-200 shadow-xs active:scale-95">
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
        <span id="toggle-28d-text">Show 28-Day History</span>
      </button>

      <div id="global-28d-container" class="mt-4 space-y-4 hidden text-left">
        <!-- Full 28-day grids -->
      </div>
    </div>

  </div>

  <!-- Minimal Bottom Sheet for Editing Drinks -->
  <div id="edit-sheet" class="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/40 backdrop-blur-xs transition-opacity opacity-0 pointer-events-none duration-150">
    <div id="edit-sheet-panel" class="w-full max-w-sm bg-white rounded-t-3xl p-5 shadow-2xl border-t border-slate-200 transform translate-y-full transition-transform duration-150 space-y-4">
      
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto"></div>

      <div class="flex items-center justify-between">
        <div>
          <h3 id="sheet-date-title" class="text-sm font-black text-slate-900">Monday, Oct 19</h3>
          <p class="text-[11px] font-bold text-slate-400">Log Alcohol Units</p>
        </div>
        <button onclick="closeSheet()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 active:scale-90">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Big Stepper -->
      <div class="flex items-center justify-center gap-5 py-2">
        <button 
          onclick="stepAlcoholFromSheet(-1)" 
          class="w-16 h-16 rounded-2xl bg-slate-100 active:bg-slate-200 text-slate-800 text-3xl font-black flex items-center justify-center active:scale-90 transition-transform">
          -
        </button>
        <div class="text-center min-w-20">
          <span id="sheet-alcohol-value" class="text-4xl font-black text-slate-900">0</span>
          <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Units</span>
        </div>
        <button 
          onclick="stepAlcoholFromSheet(1)" 
          class="w-16 h-16 rounded-2xl bg-amber-500 active:bg-amber-600 text-white text-3xl font-black flex items-center justify-center active:scale-90 transition-transform shadow-xs">
          +
        </button>
      </div>

      <!-- Quick 1-Tap Presets -->
      <div class="grid grid-cols-4 gap-2 pt-2 border-t border-slate-100">
        <button onclick="setAlcoholFromSheet(0)" class="py-2.5 rounded-xl text-xs font-black bg-slate-100 text-slate-700 active:bg-slate-200">0 (Zero)</button>
        <button onclick="setAlcoholFromSheet(2)" class="py-2.5 rounded-xl text-xs font-black bg-amber-50 border border-amber-200 text-amber-800 active:bg-amber-100">2u (Pint)</button>
        <button onclick="setAlcoholFromSheet(3)" class="py-2.5 rounded-xl text-xs font-black bg-amber-50 border border-amber-200 text-amber-800 active:bg-amber-100">3u (Wine)</button>
        <button onclick="setAlcoholFromSheet(5)" class="py-2.5 rounded-xl text-xs font-black bg-amber-50 border border-amber-200 text-amber-800 active:bg-amber-100">5u</button>
      </div>

      <button 
        onclick="closeSheet()" 
        class="w-full py-3 bg-slate-900 active:bg-slate-800 text-white rounded-xl font-black text-xs shadow-xs">
        Done
      </button>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://oaltkxblacpjjecpauya.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TMGWYUqc50BRxAynmGZRoA_YJu1a02f';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Generate 28 days ending Today
    function get28Days() {
      const days = [];
      const today = new Date();
      for (let i = 27; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const dateKey = `${yyyy}-${mm}-${dd}`;

        days.push({
          dateKey,
          daysAgo: i,
          isToday: i === 0,
          dayLetter: d.toLocaleDateString('en-US', { weekday: 'narrow' }),
          dayNum: d.getDate(),
          label: d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
        });
      }
      return days;
    }

    const ALL_DAYS = get28Days();
    const TODAY = ALL_DAYS[ALL_DAYS.length - 1];
    const TODAY_KEY = TODAY.dateKey;

    document.getElementById('today-headline').innerText = `Today is ${TODAY.label}`;

    function getInitialData() {
      const cals = {};
      const alcohol = {};
      const workout = {};

      ALL_DAYS.forEach(day => {
        if (day.daysAgo < 7) {
          if (day.daysAgo === 0 || day.daysAgo === 1 || day.daysAgo === 3 || day.daysAgo === 4 || day.daysAgo === 6) {
            cals[day.dateKey] = '1700';
          } else if (day.daysAgo === 2 || day.daysAgo === 5) {
            cals[day.dateKey] = 'M';
          }
        }
        if (day.daysAgo === 2) alcohol[day.dateKey] = 3;
        if (day.daysAgo === 5) alcohol[day.dateKey] = 2;
        if (day.daysAgo <= 7) workout[day.dateKey] = true;
      });

      return { cals, alcohol, workout };
    }

    let state = { cals: {}, alcohol: {}, workout: {} };
    let currentSheetDateKey = null;
    let show28Days = false;

    async function initState() {
      const startDate = ALL_DAYS[0].dateKey;
      const { data } = await db
        .from('habit_tracker')
        .select('date, calories, alcohol_units, activity')
        .gte('date', startDate);

      const cals = {};
      const alcohol = {};
      const workout = {};

      if (data && data.length > 0) {
        data.forEach(row => {
          if (row.calories) cals[row.date] = row.calories;
          if (row.alcohol_units) alcohol[row.date] = row.alcohol_units;
          if (row.activity) workout[row.date] = true;
        });
        state = { cals, alcohol, workout };
      } else {
        state = getInitialData();
        await upsertAll();
      }

      render();
    }

    async function upsertDay(dateKey) {
      const { error } = await db.from('habit_tracker').upsert({
        date: dateKey,
        calories: state.cals[dateKey] || null,
        alcohol_units: state.alcohol[dateKey] || null,
        activity: state.workout[dateKey] || null,
        updated_at: new Date().toISOString()
      }, { onConflict: 'date' });
      if (error) console.error('upsertDay error:', JSON.stringify(error));
    }

    async function upsertAll() {
      const rows = ALL_DAYS.map(day => ({
        date: day.dateKey,
        calories: state.cals[day.dateKey] || null,
        alcohol_units: state.alcohol[day.dateKey] || null,
        activity: state.workout[day.dateKey] || null,
        updated_at: new Date().toISOString()
      }));
      const { error } = await db.from('habit_tracker').upsert(rows, { onConflict: 'date' });
      if (error) console.error('upsertAll error:', JSON.stringify(error));
    }

    function saveState(dateKey) {
      render();
      upsertDay(dateKey);
    }

    async function resetDemoData() {
      state = getInitialData();
      render();
      await upsertAll();
    }

    function toggle28DayView() {
      show28Days = !show28Days;
      document.getElementById('toggle-28d-text').innerText = show28Days ? 'Hide 28-Day History' : 'Show 28-Day History';
      document.getElementById('global-28d-container').classList.toggle('hidden', !show28Days);
      render();
    }

    // Direct 1-tap toggling
    function cycleCalorie(dateKey) {
      const cur = state.cals[dateKey];
      if (!cur) {
        state.cals[dateKey] = '1700';
        if (dateKey === TODAY_KEY) confetti({ particleCount: 20, spread: 40, origin: { y: 0.8 } });
      } else if (cur === '1700') {
        state.cals[dateKey] = 'M';
      } else {
        delete state.cals[dateKey];
      }
      saveState(dateKey);
    }

    function toggleWorkout(dateKey) {
      const cur = Boolean(state.workout[dateKey]);
      state.workout[dateKey] = !cur;
      if (!cur && dateKey === TODAY_KEY) {
        confetti({ particleCount: 25, spread: 45, origin: { y: 0.8 } });
      }
      saveState(dateKey);
    }

    // Alcohol Sheet modal for easy forward/backward stepping
    function openAlcoholSheet(dateKey) {
      currentSheetDateKey = dateKey;
      const dayObj = ALL_DAYS.find(d => d.dateKey === dateKey);
      document.getElementById('sheet-date-title').innerText = dayObj?.isToday ? `Today (${dayObj.label})` : dayObj?.label || dateKey;
      updateSheetAlcoholValue();

      const backdrop = document.getElementById('edit-sheet');
      const panel = document.getElementById('edit-sheet-panel');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      panel.classList.remove('translate-y-full');
      if (window.lucide) window.lucide.createIcons();
    }

    function closeSheet() {
      const backdrop = document.getElementById('edit-sheet');
      const panel = document.getElementById('edit-sheet-panel');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
      panel.classList.add('translate-y-full');
      currentSheetDateKey = null;
    }

    function updateSheetAlcoholValue() {
      if (!currentSheetDateKey) return;
      const val = Number(state.alcohol[currentSheetDateKey]) || 0;
      document.getElementById('sheet-alcohol-value').innerText = val;
    }

    function stepAlcoholFromSheet(delta) {
      if (!currentSheetDateKey) return;
      const cur = Number(state.alcohol[currentSheetDateKey]) || 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) delete state.alcohol[currentSheetDateKey];
      else state.alcohol[currentSheetDateKey] = next;
      saveState(currentSheetDateKey);
      updateSheetAlcoholValue();
    }

    function setAlcoholFromSheet(val) {
      if (!currentSheetDateKey) return;
      if (val === 0) delete state.alcohol[currentSheetDateKey];
      else state.alcohol[currentSheetDateKey] = val;
      saveState(currentSheetDateKey);
      updateSheetAlcoholValue();
    }

    const CARD_BASE = 'rounded-3xl p-4 shadow-xs border space-y-3';
    const CARD_STATUS = {
      green:   'bg-emerald-50 border-emerald-200',
      amber:   'bg-amber-50 border-amber-200',
      red:     'bg-rose-50 border-rose-200',
      neutral: 'bg-white border-slate-200/80'
    };

    function setCardStatus(id, status) {
      document.getElementById(id).className = `${CARD_BASE} ${CARD_STATUS[status]}`;
    }

    function render() {
      const last7Days = ALL_DAYS.slice(21);

      // --- 1. CALORIES ---
      let count1700 = 0;
      let countMaint = 0;
      last7Days.forEach(d => {
        if (state.cals[d.dateKey] === '1700') count1700++;
        if (state.cals[d.dateKey] === 'M') countMaint++;
      });

      const calsStatus = count1700 >= 4 ? 'green' : count1700 >= 2 ? 'amber' : 'red';
      setCardStatus('card-cals', calsStatus);

      document.getElementById('cals-badges').innerHTML = `
        <span class="px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-100">${count1700}/5d 1700</span>
        <span class="px-2 py-0.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-100">${countMaint}/2d M</span>
      `;

      document.getElementById('cals-7d-row').innerHTML = last7Days.map(d => {
        const val = state.cals[d.dateKey];
        const isToday = d.isToday;
        return `
          <button 
            onclick="cycleCalorie('${d.dateKey}')" 
            class="h-16 rounded-2xl flex flex-col items-center justify-between py-2 transition-transform active:scale-90 ${
              val === '1700' 
                ? 'bg-indigo-600 text-white font-black' 
                : val === 'M'
                  ? 'bg-amber-500 text-white font-black'
                  : isToday 
                    ? 'bg-white border-2 border-slate-900 text-slate-800' 
                    : 'bg-slate-100/80 text-slate-400'
            }">
            <span class="text-[10px] font-bold uppercase opacity-80">${d.dayLetter}</span>
            <span class="text-xs font-black">${d.dayNum}</span>
            <span class="text-[9px] font-black uppercase tracking-tight">${val || '·'}</span>
          </button>
        `;
      }).join('');

      // --- 2. ALCOHOL ---
      let units7d = 0;
      last7Days.forEach(d => {
        units7d += (Number(state.alcohol[d.dateKey]) || 0);
      });
      const left = Math.max(0, 14 - units7d);
      const isOver = units7d > 14;

      const alcoholStatus = isOver ? 'red' : units7d > 10 ? 'amber' : 'green';
      setCardStatus('card-alcohol', alcoholStatus);

      document.getElementById('alcohol-pill').innerHTML = isOver
        ? `<span class="px-2.5 py-1 rounded-lg bg-rose-100 text-rose-800 border border-rose-200">${units7d}/14u &bull; ${units7d - 14}u Over</span>`
        : `<span class="px-2.5 py-1 rounded-lg ${left <= 3 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'} border border-slate-200/80">${units7d}/14u &bull; ${left}u left</span>`;

      document.getElementById('alcohol-7d-row').innerHTML = last7Days.map(d => {
        const u = Number(state.alcohol[d.dateKey]) || 0;
        const isToday = d.isToday;
        return `
          <button 
            onclick="openAlcoholSheet('${d.dateKey}')" 
            class="h-16 rounded-2xl flex flex-col items-center justify-between py-2 transition-transform active:scale-90 ${
              u > 0 
                ? 'bg-amber-500 text-white font-black shadow-xs' 
                : isToday 
                  ? 'bg-white border-2 border-slate-900 text-slate-800' 
                  : 'bg-slate-100/80 text-slate-400'
            }">
            <span class="text-[10px] font-bold uppercase opacity-80">${d.dayLetter}</span>
            <span class="text-xs font-black">${d.dayNum}</span>
            <span class="text-[10px] font-black">${u > 0 ? `${u}u` : '0'}</span>
          </button>
        `;
      }).join('');

      // --- 3. ACTIVITY ---
      const activeDays7 = last7Days.filter(d => state.workout[d.dateKey]).length;
      const activityStatus = activeDays7 >= 5 ? 'green' : activeDays7 >= 3 ? 'amber' : 'red';
      setCardStatus('card-activity', activityStatus);

      let streak = 0;
      let idx = ALL_DAYS.length - 1;
      if (state.workout[ALL_DAYS[idx].dateKey]) {
        while (idx >= 0 && state.workout[ALL_DAYS[idx].dateKey]) {
          streak++;
          idx--;
        }
      } else {
        idx = ALL_DAYS.length - 2;
        while (idx >= 0 && state.workout[ALL_DAYS[idx].dateKey]) {
          streak++;
          idx--;
        }
      }

      document.getElementById('activity-streak-pill').innerHTML = `
        <span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1">
          <i data-lucide="flame" class="w-3 h-3 fill-emerald-600 text-emerald-600"></i> ${streak}d Streak
        </span>
      `;

      document.getElementById('activity-7d-row').innerHTML = last7Days.map(d => {
        const done = Boolean(state.workout[d.dateKey]);
        const isToday = d.isToday;
        return `
          <button 
            onclick="toggleWorkout('${d.dateKey}')" 
            class="h-16 rounded-2xl flex flex-col items-center justify-between py-2 transition-transform active:scale-90 ${
              done 
                ? 'bg-emerald-600 text-white font-black' 
                : isToday 
                  ? 'bg-white border-2 border-slate-900 text-slate-800' 
                  : 'bg-slate-100/80 text-slate-400'
            }">
            <span class="text-[10px] font-bold uppercase opacity-80">${d.dayLetter}</span>
            <span class="text-xs font-black">${d.dayNum}</span>
            <i data-lucide="${done ? 'check' : 'minus'}" class="w-3.5 h-3.5 stroke-[3]"></i>
          </button>
        `;
      }).join('');

      // Render 28-day container if opened
      if (show28Days) {
        render28DayHistory();
      }

      if (window.lucide) window.lucide.createIcons();
    }

    function render28DayHistory() {
      const container = document.getElementById('global-28d-container');
      container.innerHTML = `
        <div class="bg-white rounded-3xl p-4 border border-slate-200 space-y-4">
          <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider">Past 4 Weeks Overview</h3>
          
          <!-- 4 weeks grid -->
          <div class="space-y-3">
            ${[0, 1, 2, 3].map(w => {
              const weekDays = ALL_DAYS.slice(w * 7, (w + 1) * 7);
              return `
                <div class="space-y-1">
                  <div class="text-[10px] font-bold text-slate-400">Week ${w + 1} (${weekDays[0].label} – ${weekDays[6].label})</div>
                  <div class="grid grid-cols-7 gap-1">
                    ${weekDays.map(d => {
                      const cal = state.cals[d.dateKey];
                      const alc = Number(state.alcohol[d.dateKey]) || 0;
                      const act = Boolean(state.workout[d.dateKey]);
                      return `
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-1.5 text-center flex flex-col justify-between h-14">
                          <span class="text-[9px] font-bold text-slate-400">${d.dayNum}</span>
                          <span class="text-[8px] font-black ${cal === '1700' ? 'text-indigo-600' : cal === 'M' ? 'text-amber-600' : 'text-slate-300'}">${cal || '·'}</span>
                          <span class="text-[8px] font-black ${alc > 0 ? 'text-amber-700' : 'text-slate-300'}">${alc > 0 ? `${alc}u` : '·'}</span>
                          <span class="text-[8px] font-black ${act ? 'text-emerald-600' : 'text-slate-300'}">${act ? '✓' : '·'}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', initState);
  </script>
</body>
</html>
